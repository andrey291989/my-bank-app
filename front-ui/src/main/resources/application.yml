server:
  port: 8080

spring:
  application:
    name: front-ui
  security:
    oauth2:
      client:
        registration:
          bank-client:
            client-id: bank-frontend
            client-secret: frontend-secret
            scope: openid,profile,email
            redirect-uri: http://localhost:8080/login/oauth2/code/bank-client
            authorization-grant-type: authorization_code
        provider:
          bank-client:
            issuer-uri: http://localhost:9000/realms/bank

gateway:
  url: http://gateway:8081

spring.cloud.consul.enabled: false
spring.cloud.discovery.enabled: false

# ==================== Observability (метрики + трейсинг) ====================
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  prometheus:
    metrics:
      export:
        enabled: true
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}

# Хост Logstash для доставки логов (используется в logback-spring.xml)
logstash:
  host: ${LOGSTASH_HOST:localhost}
  port: ${LOGSTASH_PORT:5000}

logging:
  level:
    ru.yandex.practicum: DEBUG
    org.springframework.security: INFO