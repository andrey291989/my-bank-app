server:
  port: 8083

spring:
  application:
    name: cash-service

  datasource:
    url: jdbc:postgresql://localhost:5432/bank_db
    username: bank_user
    password: bank_password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: cash_schema

  flyway:
    enabled: true
    baseline-on-migrate: true
    schemas: cash_schema
    locations: classpath:db/migration

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:9000/realms/bank
          jwk-set-uri: http://localhost:9000/realms/bank/protocol/openid-connect/certs
      client:
        registration:
          cash-client:
            client-id: cash-service
            client-secret: cash-secret
            scope: openid,profile
            authorization-grant-type: client_credentials
        provider:
          cash-client:
            issuer-uri: http://localhost:9000/realms/bank

  cloud:
    # Spring Cloud 2024.0.1 официально совместим с Spring Boot 3.4.x, а проект собран
    # на 3.5.7. Без этого флага CompatibilityVerifier валит приложение на старте
    # (APPLICATION FAILED TO START), то есть pod уйдёт в CrashLoopBackOff.
    compatibility-verifier:
      enabled: false
    consul:
      host: localhost
      port: 8500
      discovery:
        enabled: true
        service-name: cash-service
        prefer-ip-address: true
        health-check-path: /actuator/health
        health-check-interval: 10s
      config:
        enabled: true
        format: YAML
        prefix: config
        default-context: application

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: cash-service-group

services:
  accounts:
    url: http://accounts-service

# ==================== Observability (метрики + трейсинг) ====================
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  prometheus:
    metrics:
      export:
        enabled: true
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}

# Хост Logstash для доставки логов (используется в logback-spring.xml)
logstash:
  host: ${LOGSTASH_HOST:localhost}
  port: ${LOGSTASH_PORT:5000}

logging:
  level:
    ru.yandex.practicum: DEBUG
    org.springframework.security: INFO
    org.apache.kafka: WARN