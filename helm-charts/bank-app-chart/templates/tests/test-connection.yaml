apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "bank-app-chart.fullname" . }}-test-connection"
  labels:
    {{- include "bank-app-chart.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: wget
      image: busybox
      command: ['wget']
      # The front-ui Service is created by the front-ui subchart, whose fullname
      # template resolves to "<release>-front-ui" — not to this chart's fullname.
      args: ['{{ .Release.Name }}-front-ui:{{ index .Values "front-ui" "service" "port" }}']
  restartPolicy: Never