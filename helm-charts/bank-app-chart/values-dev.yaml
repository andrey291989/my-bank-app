# Values for development environment
# This configuration uses minimal resources for local development

# Global values accessible to all subcharts
global:
  postgresql:
    host: bank-postgresql
    port: 5432
    database: bank_db
    username: bank_user
    # Password will be stored in Kubernetes Secret
    password: ""

# Enable/disable components
postgresql:
  enabled: true
  auth:
    postgresPassword: ""
    username: bank_user
    password: ""
    database: bank_db
  primary:
    persistence:
      enabled: false

keycloak:
  enabled: true
  auth:
    adminUser: admin
    adminPassword: ""
  postgresql:
    enabled: false
  externalDatabase:
    host: bank-postgresql-keycloak
    port: 5432
    user: keycloak_user
    password: ""
    database: keycloak_db

# Kafka configuration for development
kafka:
  enabled: true
  zookeeper:
    enabled: true
    replicaCount: 1
    resources:
      limits:
        cpu: 100m
        memory: 128Mi
      requests:
        cpu: 50m
        memory: 64Mi
  replicaCount: 1
  listeners:
    client:
      protocol: PLAINTEXT
    external:
      protocol: PLAINTEXT
  service:
    ports:
      client: 9092
  persistence:
    enabled: false  # No persistence for dev
  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi

# Subchart configurations
front-ui:
  enabled: true
  replicaCount: 1
  image:
    repository: bank/front-ui
    pullPolicy: IfNotPresent
    tag: "latest"
  service:
    type: ClusterIP
    port: 8080
  ingress:
    enabled: true
    className: ""
    hosts:
      - host: bank.local
        paths:
          - path: /
            pathType: Prefix
  resources:
    limits:
      cpu: 100m
      memory: 128Mi
    requests:
      cpu: 50m
      memory: 64Mi
  autoscaling:
    enabled: false

gateway:
  enabled: true
  replicaCount: 1
  image:
    repository: bank/gateway
    pullPolicy: IfNotPresent
    tag: "latest"
  service:
    type: ClusterIP
    port: 8081
  ingress:
    enabled: true
    className: ""
    hosts:
      - host: api.bank.local
        paths:
          - path: /api
            pathType: Prefix
  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi
  autoscaling:
    enabled: false

