# Values for testing environment
# This configuration uses medium resources for testing

# Global values accessible to all subcharts
global:
  postgresql:
    host: bank-postgresql
    port: 5432
    database: bank_db
    username: bank_user
    # Password will be stored in Kubernetes Secret
    password: ""

# Enable/disable components
postgresql:
  enabled: true
  auth:
    postgresPassword: ""
    username: bank_user
    password: ""
    database: bank_db
  primary:
    persistence:
      enabled: true
      size: 2Gi

keycloak:
  enabled: true
  auth:
    adminUser: admin
    adminPassword: ""
  postgresql:
    enabled: false
  externalDatabase:
    host: bank-postgresql-keycloak
    port: 5432
    user: keycloak_user
    password: ""
    database: keycloak_db

# Kafka configuration for testing
kafka:
  enabled: true
  zookeeper:
    enabled: true
    replicaCount: 1
    resources:
      limits:
        cpu: 200m
        memory: 256Mi
      requests:
        cpu: 100m
        memory: 128Mi
  replicaCount: 1
  listeners:
    client:
      protocol: PLAINTEXT
    external:
      protocol: PLAINTEXT
  service:
    ports:
      client: 9092
  persistence:
    enabled: true
    size: 4Gi
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 250m
      memory: 256Mi

# Subchart configurations
front-ui:
  enabled: true
  replicaCount: 1
  image:
    repository: bank/front-ui
    pullPolicy: IfNotPresent
    tag: "latest"
  service:
    type: ClusterIP
    port: 8080
  ingress:
    enabled: true
    className: ""
    hosts:
      - host: bank.local
        paths:
          - path: /
            pathType: Prefix
  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi
  autoscaling:
    enabled: false

gateway:
  enabled: true
  replicaCount: 1
  image:
    repository: bank/gateway
    pullPolicy: IfNotPresent
    tag: "latest"
  service:
    type: ClusterIP
    port: 8081
  ingress:
    enabled: true
    className: ""
    hosts:
      - host: api.bank.local
        paths:
          - path: /api
            pathType: Prefix
  resources:
    limits:
      cpu: 300m
      memory: 384Mi
    requests:
      cpu: 150m
      memory: 192Mi
  autoscaling:
    enabled: false

accounts-service:
  enabled: true
  replicaCount: 1
  image:
