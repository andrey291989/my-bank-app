# Общие переменные окружения observability (Zipkin, Logstash) для всех приложений
x-observability-env: &observability-env
  ZIPKIN_ENDPOINT: "http://zipkin:9411/api/v2/spans"
  LOGSTASH_HOST: "logstash"
  LOGSTASH_PORT: "5000"

services:
  # ==================== INFRASTRUCTURE ====================

  # PostgreSQL для банковских сервисов
  postgres:
    image: postgres:16-alpine
    container_name: bank-postgres
    environment:
      POSTGRES_DB: bank_db
      POSTGRES_USER: bank_user
      POSTGRES_PASSWORD: bank_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    networks:
      - bank-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bank_user -d bank_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # PostgreSQL для Keycloak (отдельная база)
  keycloak-db:
    image: postgres:16-alpine
    container_name: keycloak-db
    environment:
      POSTGRES_DB: keycloak_db
      POSTGRES_USER: keycloak_user
      POSTGRES_PASSWORD: keycloak_password
    volumes:
      - keycloak_db_data:/var/lib/postgresql/data
    networks:
      - bank-network

  # Consul (Service Discovery & Config)
  consul:
    image: hashicorp/consul:1.18
    container_name: bank-consul
    command: agent -server -bootstrap-expect=1 -client=0.0.0.0 -ui
    ports:
      - "8500:8500"
      - "8600:8600"
    volumes:
      - consul_data:/consul/data
    networks:
      - bank-network
    healthcheck:
      test: ["CMD", "consul", "members"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Keycloak (OAuth2 Server)
  keycloak:
    image: quay.io/keycloak/keycloak:24.0.5
    container_name: bank-keycloak
    command: start-dev --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak_db
      KC_DB_USERNAME: keycloak_user
      KC_DB_PASSWORD: keycloak_password
      KC_HTTP_PORT: 8080
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "9000:8080"
    volumes:
      - ./keycloak-config:/opt/keycloak/data/import
    networks:
      - bank-network

  # Zookeeper (for Kafka)
  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    container_name: bank-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - bank-network

  # Kafka
  kafka:
    image: confluentinc/cp-kafka:latest
    container_name: bank-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    networks:
      - bank-network

  # ==================== MICROSERVICES ====================

  # Gateway API
  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    container_name: bank-gateway
    environment:
      <<: *observability-env
      SPRING_PROFILES_ACTIVE: docker
      SPRING_CLOUD_CONSUL_HOST: consul
      SPRING_CLOUD_CONSUL_PORT: 8500
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://keycloak:8080/realms/bank
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/bank/protocol/openid-connect/certs
    ports:
      - "8081:8081"
    depends_on:
      consul:
        condition: service_healthy
    networks:
      - bank-network
    restart: on-failure

  # Accounts Service
  accounts-service:
    build:
      context: .
      dockerfile: accounts-service/Dockerfile
    container_name: bank-accounts-service
    environment:
      <<: *observability-env
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/bank_db
      SPRING_DATASOURCE_USERNAME: bank_user
      SPRING_DATASOURCE_PASSWORD: bank_password
      SPRING_CLOUD_CONSUL_HOST: consul
      SPRING_CLOUD_CONSUL_PORT: 8500
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://keycloak:8080/realms/bank
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/bank/protocol/openid-connect/certs
      SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_BANK_CLIENT_ISSUER_URI: http://keycloak:8080/realms/bank
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_KAFKA_CONSUMER_GROUP_ID: accounts-service-group
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
      consul:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - bank-network
    restart: on-failure

  # Cash Service
  cash-service:
    build:
      context: .
      dockerfile: cash-service/Dockerfile
    container_name: bank-cash-service
    environment:
      <<: *observability-env
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/bank_db
      SPRING_DATASOURCE_USERNAME: bank_user
      SPRING_DATASOURCE_PASSWORD: bank_password
      SPRING_CLOUD_CONSUL_HOST: consul
      SPRING_CLOUD_CONSUL_PORT: 8500
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://keycloak:8080/realms/bank
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/bank/protocol/openid-connect/certs
      SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_CASH_CLIENT_ISSUER_URI: http://keycloak:8080/realms/bank
      SERVICES_ACCOUNTS_URL: http://accounts-service:8082
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_KAFKA_CONSUMER_GROUP_ID: cash-service-group
    ports:
      - "8083:8083"
    depends_on:
      postgres:
        condition: service_healthy
      consul:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - bank-network
    restart: on-failure

  # Transfer Service
  transfer-service:
    build:
      context: .
      dockerfile: transfer-service/Dockerfile
    container_name: bank-transfer-service
    environment:
      <<: *observability-env
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/bank_db
      SPRING_DATASOURCE_USERNAME: bank_user
      SPRING_DATASOURCE_PASSWORD: bank_password
      SPRING_CLOUD_CONSUL_HOST: consul
      SPRING_CLOUD_CONSUL_PORT: 8500
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://keycloak:8080/realms/bank
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/bank/protocol/openid-connect/certs
      SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_TRANSFER_CLIENT_ISSUER_URI: http://keycloak:8080/realms/bank
      SERVICES_ACCOUNTS_URL: http://accounts-service:8082
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_KAFKA_CONSUMER_GROUP_ID: transfer-service-group
    ports:
      - "8084:8084"
    depends_on:
      postgres:
        condition: service_healthy
      consul:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - bank-network
    restart: on-failure

  # Notifications Service
  notifications-service:
    build:
      context: .
      dockerfile: notifications-service/Dockerfile
    container_name: bank-notifications-service
    environment:
      <<: *observability-env
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/bank_db
      SPRING_DATASOURCE_USERNAME: bank_user
      SPRING_DATASOURCE_PASSWORD: bank_password
      SPRING_CLOUD_CONSUL_HOST: consul
      SPRING_CLOUD_CONSUL_PORT: 8500
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://keycloak:8080/realms/bank
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/bank/protocol/openid-connect/certs
      NOTIFICATIONS_DELIVERY_METHOD: LOG
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_KAFKA_CONSUMER_GROUP_ID: notifications-service-group
    ports:
      - "8085:8085"
    depends_on:
      postgres:
        condition: service_healthy
      consul:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - bank-network
    restart: on-failure

  # Front UI
  front-ui:
    build:
      context: .
      dockerfile: front-ui/Dockerfile
    container_name: bank-front-ui
    environment:
      <<: *observability-env
      SPRING_PROFILES_ACTIVE: docker
      SPRING_CLOUD_CONSUL_HOST: consul
      SPRING_CLOUD_CONSUL_PORT: 8500
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_BANK_CLIENT_ISSUER_URI: http://keycloak:8080/realms/bank
      SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_BANK_CLIENT_ISSUER_URI: http://keycloak:8080/realms/bank
      GATEWAY_URL: http://gateway:8081
    ports:
      - "8080:8080"
    depends_on:
      gateway:
        condition: service_started
      consul:
        condition: service_healthy
    networks:
      - bank-network
    restart: on-failure

  # ==================== OBSERVABILITY ====================

  # Zipkin — распределённая трассировка (in-memory хранилище)
  zipkin:
    image: openzipkin/zipkin:3
    container_name: bank-zipkin
    environment:
      STORAGE_TYPE: mem
    ports:
      - "9411:9411"
    networks:
      - bank-network

  # Prometheus — сбор метрик
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: bank-prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alert.rules.yml:/etc/prometheus/alert.rules.yml:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    ports:
      - "9090:9090"
    depends_on:
      - alertmanager
    networks:
      - bank-network

  # Alertmanager — маршрутизация алертов
  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: bank-alertmanager
    volumes:
      - ./prometheus/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
    ports:
      - "9093:9093"
    networks:
      - bank-network

  # Grafana — визуализация метрик
  grafana:
    image: grafana/grafana:11.2.0
    container_name: bank-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - bank-network

  # Elasticsearch — хранение логов
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    container_name: bank-elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    networks:
      - bank-network

  # Logstash — обработка и доставка логов в Elasticsearch
  logstash:
    image: docker.elastic.co/logstash/logstash:8.13.4
    container_name: bank-logstash
    volumes:
      - ./elk/logstash/pipeline:/usr/share/logstash/pipeline:ro
      - ./elk/logstash/config/logstash.yml:/usr/share/logstash/config/logstash.yml:ro
    ports:
      - "5000:5000"
    depends_on:
      - elasticsearch
    networks:
      - bank-network

  # Kibana — визуализация логов
  kibana:
    image: docker.elastic.co/kibana/kibana:8.13.4
    container_name: bank-kibana
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch
    networks:
      - bank-network

# ==================== VOLUMES ====================
volumes:
  postgres_data:
  keycloak_db_data:
  consul_data:
  grafana_data:
  es_data:

# ==================== NETWORKS ====================
networks:
  bank-network:
    driver: bridge