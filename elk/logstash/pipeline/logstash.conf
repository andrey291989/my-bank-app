# ==========================================================================
# Logstash pipeline для логов приложения "Банк".
#   input  — приём логов от микросервисов по TCP в формате JSON (json_lines),
#            который отправляет logstash-logback-encoder.
#   filter — извлечение полей, маскирование паролей и номеров счетов/карт.
#   output — запись в Elasticsearch (индекс bank-logs-YYYY.MM.dd).
# ==========================================================================

input {
  tcp {
    port => 5000
    codec => json_lines
  }
}

filter {
  # Приводим имя сервиса к единому полю
  if [service] {
    mutate { add_field => { "[application]" => "%{[service]}" } }
  }

  # ---- Маскирование чувствительных данных ----
  # Пароли вида password=..., "password":"...", pwd=...
  mutate {
    gsub => [
      "message", "(?i)(password|passwd|pwd|secret|client-secret)([\"']?\s*[:=]\s*[\"']?)[^\"',}\s]+", "\1\2****",
      "message", "(?i)(authorization:\s*bearer\s+)[A-Za-z0-9._\-]+", "\1****"
    ]
  }

  # Номера счетов/карт: последовательности из 12+ цифр -> оставляем последние 4
  mutate {
    gsub => [
      "message", "\b\d{8,}(\d{4})\b", "****\1"
    ]
  }

  # Гарантируем наличие trace/span полей (для связи с Zipkin)
  if ![traceId] { mutate { add_field => { "traceId" => "-" } } }
  if ![spanId]  { mutate { add_field => { "spanId"  => "-" } } }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "bank-logs-%{+YYYY.MM.dd}"
  }
  # Для отладки конвейера можно раскомментировать вывод в stdout:
  # stdout { codec => rubydebug }
}
