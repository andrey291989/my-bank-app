# ==========================================================================
# Правила алертов Prometheus для приложения "Банк".
# Пороговые значения выбраны для демонстрации; их можно менять под нагрузку.
# ==========================================================================
groups:
  # ---------------------- Доступность ----------------------
  - name: availability
    rules:
      - alert: ServiceDown
        expr: up{job="bank-microservices"} == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "Сервис {{ $labels.instance }} недоступен"
          description: "Prometheus не может собрать метрики с {{ $labels.instance }} более 30 секунд."

  # ---------------------- Критические HTTP-метрики ----------------------
  - name: http
    rules:
      - alert: HighHttp5xxRate
        expr: |
          sum by (application) (rate(http_server_requests_seconds_count{status=~"5.."}[1m])) > 0.2
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Много 5xx в {{ $labels.application }}"
          description: "Частота ответов 5xx > 0.2 rps в течение минуты."

      - alert: HighHttp4xxRate
        expr: |
          sum by (application) (rate(http_server_requests_seconds_count{status=~"4.."}[1m])) > 1
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Много 4xx в {{ $labels.application }}"
          description: "Частота ответов 4xx > 1 rps в течение 2 минут."

      - alert: HighHttpLatencyP99
        expr: |
          histogram_quantile(0.99, sum by (application, le) (rate(http_server_requests_seconds_bucket[5m]))) > 1
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Высокая задержка (p99) в {{ $labels.application }}"
          description: "99-й персентиль времени ответа > 1s в течение 2 минут."

  # ---------------------- JVM ----------------------
  - name: jvm
    rules:
      - alert: HighJvmHeapUsage
        expr: |
          sum by (application) (jvm_memory_used_bytes{area="heap"})
            / sum by (application) (jvm_memory_max_bytes{area="heap"}) > 0.9
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Высокое потребление heap в {{ $labels.application }}"
          description: "Использование heap-памяти > 90% в течение 2 минут."

      - alert: HighCpuUsage
        expr: system_cpu_usage > 0.9
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Высокая загрузка CPU на {{ $labels.instance }}"
          description: "Загрузка CPU системы > 90% в течение 2 минут."

  # ---------------------- Бизнес-метрики ----------------------
  - name: business
    rules:
      - alert: TooManyFailedWithdrawals
        expr: sum by (login) (increase(bank_cash_withdrawal_failed_total[5m])) > 3
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Много неуспешных снятий у пользователя {{ $labels.login }}"
          description: "Более 3 неуспешных попыток снятия денег за 5 минут."

      - alert: TooManyFailedTransfers
        expr: sum by (from_login) (increase(bank_transfer_failed_total[5m])) > 3
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Много неуспешных переводов от пользователя {{ $labels.from_login }}"
          description: "Более 3 неуспешных попыток перевода денег за 5 минут."

      - alert: NotificationDeliveryFailing
        expr: sum by (login) (increase(bank_notification_send_failed_total[5m])) > 3
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Сбои доставки уведомлений пользователю {{ $labels.login }}"
          description: "Более 3 неуспешных отправок уведомлений за 5 минут."
